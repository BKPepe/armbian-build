#

ARCH=armhf
BOOTSOURCE="${MAINLINE_UBOOT_SOURCE}"
BOOTDIR='u-boot-odroid'
BOOTPATCHDIR='u-boot-odroid'
BOOTBRANCH='tag:v2026.07'
BOOTCONFIG='odroid_defconfig'
BOOTSCRIPT='boot-odroid-u2.cmd:boot.scr'
UBOOT_TARGET_MAP=";;E4412_S.bl1.HardKernel.bin bl2.signed.bin u-boot-dtb.bin E4412_S.tzsw.signed.bin"

case $BRANCH in
	current)
		declare -g KERNEL_MAJOR_MINOR="6.12"
		KERNELBRANCH='branch:linux-6.12.y'
		KERNELPATCHDIR='archive/odroidu2-6.12'
		KERNEL_BTF="no"
		;;

	edge)
		declare -g KERNEL_MAJOR_MINOR="6.18"
		KERNELBRANCH='branch:linux-6.18.y'
		KERNELPATCHDIR='archive/odroidu2-6.18'
		KERNEL_BTF="no"
		;;
esac

CPUMIN=200000
CPUMAX=1704000
GOVERNOR=ondemand
SERIALCON=ttySAC1

function uboot_custom_postprocess() {
	local blobs_dir="${SRC}/cache/sources/odroidu2-blobs"
	local blobs_url="https://raw.githubusercontent.com/benhowell/odroid-U3-emmc-u-boot-debian-bullseye/e20554ef0d3d2c6c5ca6d7c73f7e2732d87d3866"
	mkdir -p "${blobs_dir}"

	declare -A blob_hashes=(
		["E4412_S.bl1.HardKernel.bin"]="0fcf68a3ff3e47af7c6d91103d5797e4aefbefd32b1d267daff69eb6e69d2a84"
		["bl2.signed.bin"]="8f459e654ec4c1a33185ba3f8e04a13da8c6def79362948a6648f96c48897015"
		["E4412_S.tzsw.signed.bin"]="777e0efdd626863b2a6e83cd24b42ae028158aecbfec7843dad00f1b458958c3"
	)

	for blob in "${!blob_hashes[@]}"; do
		local expected_hash="${blob_hashes[$blob]}"
		if [[ ! -s "${blobs_dir}/${blob}" ]] || ! echo "${expected_hash}  ${blobs_dir}/${blob}" | sha256sum -c --status 2>/dev/null; then
			display_alert "Downloading and verifying Exynos4412 boot blob" "${blob}" "info"
			curl -sLf -o "${blobs_dir}/${blob}" "${blobs_url}/${blob}" || exit_with_error "Failed to download boot blob ${blob}"
			echo "${expected_hash}  ${blobs_dir}/${blob}" | sha256sum -c --status || exit_with_error "SHA256 mismatch for ${blob}"
		fi
		cp -f "${blobs_dir}/${blob}" .
	done
}

function write_uboot_platform() {
	local src_dir=$1
	local target_dev=$2

	if [[ $target_dev == /dev/mmcblk* && -b ${target_dev}boot0 ]]; then
		local device=${target_dev}boot0
		local ro_file="/sys/block/$(basename "$device")/force_ro"
		[[ -f $ro_file ]] && echo 0 > "$ro_file"

		# Ensure force_ro=1 is restored even if an error occurs
		trap '[[ -f "'"$ro_file"'" ]] && echo 1 > "'"$ro_file"'"; sync' EXIT INT TERM

		dd if="$src_dir/E4412_S.bl1.HardKernel.bin" of="$device" bs=512 seek=0 conv=fsync status=none || return 1
		dd if="$src_dir/bl2.signed.bin" of="$device" bs=512 seek=30 conv=fsync status=none || return 1
		dd if="$src_dir/u-boot-dtb.bin" of="$device" bs=512 seek=62 conv=fsync status=none || return 1
		dd if="$src_dir/E4412_S.tzsw.signed.bin" of="$device" bs=512 seek=2110 conv=fsync status=none || return 1

		[[ -f $ro_file ]] && echo 1 > "$ro_file"
		trap - EXIT INT TERM
	else
		local device=$target_dev
		dd if="$src_dir/E4412_S.bl1.HardKernel.bin" of="$device" bs=512 seek=1 conv=fsync status=none || return 1
		dd if="$src_dir/bl2.signed.bin" of="$device" bs=512 seek=31 conv=fsync status=none || return 1
		dd if="$src_dir/u-boot-dtb.bin" of="$device" bs=512 seek=63 conv=fsync status=none || return 1
		dd if="$src_dir/E4412_S.tzsw.signed.bin" of="$device" bs=512 seek=2111 conv=fsync status=none || return 1
	fi
	sync
}
