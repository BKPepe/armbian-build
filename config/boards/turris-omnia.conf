# Marvell Armada 385 dual core 1GB/2GB RAM SoC eMMC GBE switch SFP 2xUSB3 3xmPCIe mSATA WiFi
BOARD_NAME="Turris Omnia"
BOARD_VENDOR="cznic"
BOARDFAMILY="mvebu"
BOARD_MAINTAINER="BKPepe"
INTRODUCED="2016"
BOOTCONFIG="turris_omnia_defconfig"
BOOT_FDT_FILE="armada-385-turris-omnia.dtb"
SERIALCON="ttyS0"
HAS_VIDEO_OUTPUT="no"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
BOOTLOADER_BOOTS_FROM="mmc" # U-Boot tries the eMMC before NVMe, SATA and USB

# ENABLE_EXTENSIONS=image-output-turris-medkit also builds a medkit, which the
# Turris rescue system installs to the eMMC from a USB flash drive.

# U-Boot is in the "U-Boot" partition of the SPI NOR flash, next to the Turris
# rescue system. armbian-install does not write it, and a disk gets no U-Boot.
# To write U-Boot to the SPI NOR flash, run as root in bash:
# . /usr/lib/u-boot/platform_install.sh && write_uboot_platform "$DIR" /dev/mtdblock0
# With sudo:
# sudo bash -c '. /usr/lib/u-boot/platform_install.sh && write_uboot_platform "$DIR" /dev/mtdblock0'
# The build sources mvebu.conf after this file. mvebu.conf defines the U-Boot
# writers of the Clearfog and the Helios4. This hook replaces them.
function post_family_config__turris_omnia_uboot() {
	# armbian-install offers to write the SPI NOR flash first for NVMe, SATA and
	# USB installs while write_uboot_platform_mtd exists.
	unset write_uboot_platform write_uboot_platform_mtd

	function write_uboot_platform() {
		local image="$1/u-boot.flash" device="$2" mtd size max

		if [[ "${device}" != /dev/mtdblock* ]]; then
			echo "The Turris Omnia loads U-Boot from the SPI NOR flash, nothing is written to ${device}" >&2
			# armbian-install sets MOUNT to / when it only updates the bootloader
			if [[ "${MOUNT:-}" == / ]]; then
				echo "To write U-Boot to the SPI NOR flash, run as root: . /usr/lib/u-boot/platform_install.sh && write_uboot_platform $1 /dev/mtdblock0" >&2
				return 1
			fi
			return 0
		fi

		mtd="/sys/class/mtd/mtd${device#/dev/mtdblock}"
		if [[ "$(cat "${mtd}/name" 2> /dev/null)" != "U-Boot" ]]; then
			echo "${device} is not the U-Boot partition of the SPI NOR flash, U-Boot is not written" >&2
			return 1
		fi
		# The U-Boot environment starts at 0xF0000. U-Boot shrinks the partition to
		# that size in the device tree of Linux.
		size=$(stat -c %s "${image}") || return 1
		max=$(< "${mtd}/size")
		if ((size == 0 || size > max || size > 0xF0000)); then
			echo "${image} does not fit below the U-Boot environment, U-Boot is not written" >&2
			return 1
		fi
		# The mtd character device reads the flash itself, not a cache
		if ! dd if="${image}" of="${device}" conv=fsync status=none || ! cmp -s -n "${size}" "${image}" "/dev/${mtd##*/}"; then
			echo "Writing U-Boot to ${device} failed, write it again or recover the board with kwboot" >&2
			return 1
		fi
		echo "U-Boot was written to ${device}" >&2
	}
}

# The 5 GHz card of the Omnia needs ath10k QCA988X firmware. The Wi-Fi 6 card
# needs MT7915 firmware. ath9k needs none. armbian-firmware (521 MB) has no
# QCA988X, so the Omnia installs the Wi-Fi firmware packages of the distribution.
# A dpkg filter leaves out the other big directories of these packages, also on
# updates. The filter also applies to other packages with files in these directories.
function extension_prepare_config__turris_omnia_wifi_firmware() {
	declare -g -a TURRIS_OMNIA_WIFI_FIRMWARE=()
	case "${RELEASE}" in
		# bookworm gets firmware-mediatek from bookworm-backports.
		bookworm | trixie | forky | sid) TURRIS_OMNIA_WIFI_FIRMWARE=(firmware-atheros firmware-mediatek) ;;
		# Ubuntu compresses its firmware with zstd. The mvebu kernels load it (FW_LOADER_COMPRESS_ZSTD).
		noble | resolute) TURRIS_OMNIA_WIFI_FIRMWARE=(linux-firmware-qualcomm-wireless linux-firmware-mediatek) ;;
		*) return 0 ;; # other releases keep armbian-firmware
	esac
	declare -g INSTALL_ARMBIAN_FIRMWARE="no"
	add_packages_to_image "${TURRIS_OMNIA_WIFI_FIRMWARE[@]}"
}

# The filter must be in place before the image packages install.
function pre_install_distribution_specific__turris_omnia_wifi_firmware() {
	[[ ${#TURRIS_OMNIA_WIFI_FIRMWARE[@]} -gt 0 ]] || return 0
	display_alert "$BOARD" "Filtering the Wi-Fi firmware ${TURRIS_OMNIA_WIFI_FIRMWARE[*]}" "info"
	declare filter="${SDCARD}/etc/dpkg/dpkg.cfg.d/turris-omnia-wifi-firmware" dir
	mkdir -p "${filter%/*}"
	cat <<- EOF > "${filter}"
		# Keep only the firmware of the Wi-Fi cards of the Turris Omnia.
		# dpkg -V and armbianmonitor -v list the other files of these packages as missing:
		# ${TURRIS_OMNIA_WIFI_FIRMWARE[*]}
		# To get them, delete this file and run:
		# apt install --reinstall ${TURRIS_OMNIA_WIFI_FIRMWARE[*]}
	EOF
	# bookworm and noble packages use /lib/firmware. Newer releases use /usr/lib/firmware.
	# A pattern that starts with * makes dpkg keep every left-out link and directory.
	# The MT76 links at the top level point into mediatek/, so keep their targets.
	# Leave out the other links into the left-out directories, at the top level and in qcom/.
	# Ubuntu links the QCA988X notice to the QCA9887 notice.
	for dir in /lib/firmware /usr/lib/firmware; do
		cat <<- EOF >> "${filter}"
			path-exclude=${dir}/ar3k/*
			path-exclude=${dir}/ath6k/*
			path-exclude=${dir}/ath10k/*
			path-include=${dir}/ath10k/QCA988X*
			path-include=${dir}/ath10k/QCA9887*/notice_ath10k_firmware-5.txt*
			path-exclude=${dir}/ath11k/*
			path-exclude=${dir}/ath12k/*
			path-exclude=${dir}/mediatek/*
			path-include=${dir}/mediatek/mt7915*
			path-include=${dir}/mediatek/mt7601u.bin*
			path-include=${dir}/mediatek/mt7650.bin*
			path-include=${dir}/mediatek/mt7662.bin*
			path-include=${dir}/mediatek/mt7662_rom_patch.bin*
			path-exclude=${dir}/qca/*
			path-exclude=${dir}/qcom/*/wlanmdsp.mbn*
			path-exclude=${dir}/qcom/*/wpss.mbn*
			path-exclude=${dir}/vpu_*
		EOF
	done
}

# The mvebu kernels accept only a regulatory.db signed with a key from
# net/wireless/certs. Debian selects a copy signed with the Debian key, so select
# the upstream copy. Ubuntu ships only the upstream copy.
function post_install_kernel_debs__turris_omnia_regdb() {
	if [[ -f "${SDCARD}"/lib/firmware/regulatory.db-upstream ]]; then
		display_alert "$BOARD" "Selecting the upstream regulatory.db" "info"
		chroot_sdcard update-alternatives --set regulatory.db /lib/firmware/regulatory.db-upstream
	fi
}

# The CPU ports of the switch carry its tagged traffic and cannot get an address.
# Keep them out of DHCP. The LAN ports lan0-lan4 and the WAN port get it.
function post_family_tweaks_bsp__turris_omnia_switch_cpu_ports() {
	display_alert "$BOARD" "Leaving the CPU ports of the switch unmanaged" "info"
	mkdir -p "${destination}"/etc/systemd/network "${destination}"/etc/NetworkManager/conf.d
	cat <<- EOF > "${destination}"/etc/systemd/network/05-turris-omnia-cpu-ports.network
		[Match]
		Name=end0 end1 eth0 eth1

		[Link]
		Unmanaged=yes
	EOF
	cat <<- EOF > "${destination}"/etc/NetworkManager/conf.d/99-turris-omnia-cpu-ports.conf
		[keyfile]
		unmanaged-devices=interface-name:end0;interface-name:end1;interface-name:eth0;interface-name:eth1
	EOF
}

# Add the drivers of the SoC watchdog, the I2C mux and the MCU to the
# initramfs. The kernel then pings the watchdog that U-Boot starts with a 60 s
# timeout. On boards whose MCU controls the PCIe resets, the PCIe controller
# and an NVMe root wait for the MCU driver. The MCU sits behind the I2C mux.
# The MCU driver has no module alias, so udev does not load it.
function post_family_tweaks_bsp__turris_omnia_initramfs_modules() {
	display_alert "$BOARD" "Adding the watchdog, I2C mux and MCU drivers to the initramfs" "info"
	mkdir -p "${destination}"/usr/share/initramfs-tools/modules.d
	cat <<- EOF > "${destination}"/usr/share/initramfs-tools/modules.d/turris-omnia
		orion_wdt
		i2c-mux-pca954x
		turris-omnia-mcu
	EOF
}

# systemd asks for a 10 min watchdog timeout at reboot. The SoC watchdog allows
# 171 s at most, so systemd stops the watchdog. With 2 min, the watchdog stays
# on while systemd-shutdown runs.
function post_family_tweaks_bsp__turris_omnia_reboot_watchdog() {
	display_alert "$BOARD" "Keeping the watchdog on while systemd-shutdown runs" "info"
	mkdir -p "${destination}"/usr/lib/systemd/system.conf.d
	cat <<- EOF > "${destination}"/usr/lib/systemd/system.conf.d/10-turris-omnia-watchdog.conf
		[Manager]
		RebootWatchdogSec=2min
	EOF
}
